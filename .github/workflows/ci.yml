
name: Student Task Manager CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Report successful checks
        run: echo "Required files exist and JavaScript syntax is valid."

